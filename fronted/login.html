<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bharat AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 153, 51, 0.15), transparent 70%);
            top: -200px;
            left: -200px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(19, 136, 8, 0.15), transparent 70%);
            bottom: -200px;
            right: -200px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .login-logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
        }

        .login-logo-wrap::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ff9933, #138808);
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0.5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-logo {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            object-fit: cover;
            position: relative;
            box-shadow: 0 8px 32px rgba(255, 153, 51, 0.3);
        }

        .login-title {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9933, #ffffff, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .msg-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .msg-box.error {
            background: rgba(255, 68, 68, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
            display: block;
        }

        .msg-box.success {
            background: rgba(76, 175, 80, 0.12);
            color: #66bb6a;
            border: 1px solid rgba(76, 175, 80, 0.3);
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            pointer-events: none;
        }

        .login-input {
            width: 100%;
            padding: 15px 18px 15px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .login-input::placeholder {
            color: #555;
        }

        .login-input:focus {
            border-color: #ff9933;
            background: rgba(255, 153, 51, 0.05);
            box-shadow: 0 0 0 4px rgba(255, 153, 51, 0.1);
        }

        .primary-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff9933, #138808);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(255, 153, 51, 0.25);
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 153, 51, 0.35);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-section {
            display: none;
        }

        .otp-section.active {
            display: block;
        }

        .back-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 12px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        .otp-hint {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .otp-hint strong {
            color: #ff9933;
        }

        .skip-link {
            display: block;
            text-align: center;
            margin-top: 28px;
            color: #555;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .skip-link:hover {
            color: #ff9933;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #444;
            font-size: 11px;
            line-height: 1.6;
        }

        .footer-text strong {
            background: linear-gradient(135deg, #ff9933, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 36px 24px;
                border-radius: 20px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-logo {
                width: 72px;
                height: 72px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo-wrap">
            <img src="bharatailogo.png" alt="Bharat AI" class="login-logo">
        </div>

        <h1 class="login-title">Welcome to Bharat AI</h1>
        <p class="login-subtitle">Sign in to continue with your desi AI assistant</p>

        <div class="msg-box" id="msgBox"></div>

        <!-- Email Section -->
        <div id="emailSection">
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <input type="text" id="nameInput" class="login-input" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <input type="email" id="emailInput" class="login-input" placeholder="Enter your email address">
            </div>
            <button class="primary-btn" id="sendOtpBtn">Send OTP</button>
        </div>

        <!-- OTP Section -->
        <div class="otp-section" id="otpSection">
            <p class="otp-hint">We sent a 6-digit code to <strong id="sentToEmail"></strong></p>
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <input type="text" id="otpInput" class="login-input" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
            </div>
            <button class="primary-btn" id="verifyOtpBtn">Verify & Sign In</button>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>

        <a href="index.html" class="skip-link">Continue without signing in →</a>

        <div class="footer-text">
            <strong>Bharat AI</strong> — India's Own AI Platform<br>
            Founded by Noor Alam
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
