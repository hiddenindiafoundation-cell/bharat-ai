<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login — Bharat AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9933">
    <link rel="icon" type="image/png" href="bharatailogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated gradient blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff9933, transparent 70%);
            top: -100px;
            left: -100px;
            animation: float1 10s ease-in-out infinite;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #138808, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: float2 12s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 80px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-80px, -80px) scale(1.1); }
        }

        /* Login Card */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, rgba(28, 28, 28, 0.95), rgba(18, 18, 18, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 153, 51, 0.2);
            border-radius: 28px;
            padding: 44px 36px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 60px rgba(255, 153, 51, 0.08);
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .login-logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }

        .login-logo-wrap::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff9933, #138808);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.5;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.15); }
        }

        .login-logo {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            object-fit: cover;
            position: relative;
            box-shadow: 0 8px 32px rgba(255, 153, 51, 0.4);
            border: 2px solid rgba(255, 153, 51, 0.3);
        }

        /* Heading */
        .login-title {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Message Box */
        .msg-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            font-weight: 500;
            text-align: center;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-box.error {
            background: rgba(255, 68, 68, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
            display: block;
        }

        .msg-box.success {
            background: rgba(76, 175, 80, 0.12);
            color: #66bb6a;
            border: 1px solid rgba(76, 175, 80, 0.3);
            display: block;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .login-input {
            width: 100%;
            padding: 16px 18px 16px 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            transition: all 0.25s;
        }

        .login-input::placeholder {
            color: #555;
        }

        .login-input:focus {
            border-color: #ff9933;
            background: rgba(255, 153, 51, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 153, 51, 0.12);
        }

        .login-input:focus + .input-icon,
        .input-group:focus-within .input-icon {
            color: #ff9933;
        }

        /* Primary Button */
        .primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff9933 0%, #ff7b00 50%, #138808 100%);
            background-size: 200% 200%;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(255, 153, 51, 0.35);
            letter-spacing: 0.3px;
            margin-top: 8px;
            animation: btnShine 3s ease infinite;
        }

        @keyframes btnShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 153, 51, 0.5);
        }

        .primary-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* OTP Section */
        .otp-section {
            display: none;
        }

        .otp-section.active {
            display: block;
            animation: msgIn 0.3s ease;
        }

        .otp-hint {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .otp-hint strong {
            color: #ff9933;
            word-break: break-all;
            display: block;
            margin-top: 4px;
            font-size: 14px;
        }

        .back-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #888;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 12px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            border-color: rgba(255, 153, 51, 0.3);
        }

        /* Skip Link */
        .skip-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .skip-link:hover {
            color: #ff9933;
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #555;
            font-size: 11px;
            line-height: 1.7;
        }

        .footer-text strong {
            background: linear-gradient(135deg, #ff9933, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 24px;
                padding-bottom: 24px;
            }

            .login-container {
                padding: 32px 22px;
                border-radius: 24px;
                max-width: 100%;
            }

            .login-logo {
                width: 72px;
                height: 72px;
                border-radius: 20px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-subtitle {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .login-input {
                font-size: 14px;
                padding: 15px 16px 15px 46px;
            }

            .input-icon {
                left: 15px;
            }

            .primary-btn {
                font-size: 14px;
                padding: 15px;
            }
        }

        @media (max-width: 360px) {
            .login-title {
                font-size: 20px;
            }

            .login-logo {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="login-container">
        <div class="login-logo-wrap">
            <img src="bharatailogo.png" alt="Bharat AI" class="login-logo">
        </div>

        <h1 class="login-title">Welcome to Bharat AI</h1>
        <p class="login-subtitle">Sign in to continue with your desi AI assistant</p>

        <div class="msg-box" id="msgBox"></div>

        <!-- Email Section -->
        <div id="emailSection">
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <input type="text" id="nameInput" class="login-input" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <input type="email" id="emailInput" class="login-input" placeholder="Enter your email address">
            </div>
            <button class="primary-btn" id="sendOtpBtn">Send OTP</button>
        </div>

        <!-- OTP Section -->
        <div class="otp-section" id="otpSection">
            <p class="otp-hint">We sent a 6-digit code to <strong id="sentToEmail"></strong></p>
            <div class="input-group">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <input type="text" id="otpInput" class="login-input" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
            </div>
            <button class="primary-btn" id="verifyOtpBtn">Verify & Sign In</button>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>

        <a href="index.html" class="skip-link">Continue without signing in →</a>

        <div class="footer-text">
            <strong>Bharat AI</strong> — India's Own AI Platform<br>
            Founded by Noor Alam
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
